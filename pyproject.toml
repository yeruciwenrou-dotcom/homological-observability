[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homological-observability"
version = "1.1.0"
description = "Homological observability and asymptotic sampling requirements for finite-state Markov jump processes"
readme = "docs/PYPI.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "HongZheng Liu" },
  { name = "YiNuo Tian" },
  { name = "Zhiyue Wu" },
  { name = "Jianqun Cheng" },
]
keywords = [
  "algebraic topology",
  "integer lattices",
  "Markov jump processes",
  "homological observability",
  "information theory",
  "reproducible research",
  "scientific software",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "matplotlib>=3.10,<4",
  "networkx>=3.6,<4",
  "numpy>=2.3,<3",
  "pandas>=2.2,<3",
  "scipy>=1.17,<2",
  "sympy>=1.14,<2",
]

[project.optional-dependencies]
test = [
  "build>=1.3,<2",
  "jsonschema>=4.25,<5",
  "mpmath>=1.3,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
homological-observability = "homological_observability.cli:main"

[project.urls]
Repository = "https://github.com/yeruciwenrou-dotcom/homological-observability"
Documentation = "https://github.com/yeruciwenrou-dotcom/homological-observability#readme"
Issues = "https://github.com/yeruciwenrou-dotcom/homological-observability/issues"
Changelog = "https://github.com/yeruciwenrou-dotcom/homological-observability/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
homological_observability = [
  "data/examples/*.json",
  "data/reference/*.csv",
  "schemas/*.json",
]

[tool.ruff]
line-length = 88
exclude = [
  ".venv",
  "generated_results",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/homological_observability/reporting.py" = ["E402"]
"tests/validate_graph_atlas.py" = ["E402"]
