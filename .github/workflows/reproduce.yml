name: Reproduce companion checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Run independent tests
        run: python -W error -m unittest discover -s tests -v
      - name: Run checks
        run: python -W error reproduce_all.py
      - name: Save reproduced evidence
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reproduced-evidence
          path: generated_results/
          if-no-files-found: error
          retention-days: 30

  quickstart:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run the one-command verification path
        run: python quickstart.py
      - name: Run the documented Linux entry point
        if: runner.os == 'Linux'
        run: .venv/bin/homological-observability example wedge-c3-c5
      - name: Run the documented Windows entry point
        if: runner.os == 'Windows'
        run: .venv\Scripts\homological-observability.exe example wedge-c3-c5

  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies and build tooling
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "build>=1.3,<2" "jsonschema>=4.25,<5" "setuptools==77.0.3" wheel twine
          python -m pip install -c requirements.txt -e ".[test]"
      - name: Verify the editable development installation
        run: |
          python -c "from pathlib import Path; import homological_observability as h; assert Path(h.__file__).resolve().is_relative_to(Path('src').resolve())"
      - name: Validate the machine-readable result contract
        run: python tests/validate_schema.py
      - name: Validate the minimum supported build backend
        run: |
          python -m build --no-isolation --outdir "$RUNNER_TEMP/minimum-dist"
          python -m twine check --strict "$RUNNER_TEMP"/minimum-dist/*
      - name: Build and test wheel and sdist outside the repository
        run: python tests/validate_distribution.py

  public-dependencies:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python-version: "3.11"}
          - {os: ubuntu-24.04, python-version: "3.12"}
          - {os: ubuntu-24.04, python-version: "3.13"}
          - {os: windows-2025, python-version: "3.12"}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install validation tooling
        run: python -m pip install "build>=1.3,<2" "jsonschema>=4.25,<5"
      - name: Resolve public ranges, test both artifacts and upgrade from 1.2.1
        run: python tests/validate_distribution.py --dependency-mode public --upgrade-from 1.2.1 --evidence-dir public-install-evidence
      - name: Save installation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-install-${{ matrix.os }}-${{ matrix.python-version }}
          path: public-install-evidence/
          if-no-files-found: warn
          retention-days: 30

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Ruff
        run: python -m pip install "ruff>=0.12,<1"
      - name: Check lint and formatting
        run: |
          ruff check .
          ruff format --check .

  atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Validate connected small graphs
        run: python tests/validate_graph_atlas.py

  required:
    name: required
    if: always()
    needs: [reproduce, quickstart, distribution, public-dependencies, lint, atlas]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm all verification jobs passed
        env:
          REPRODUCE_RESULT: ${{ needs.reproduce.result }}
          QUICKSTART_RESULT: ${{ needs.quickstart.result }}
          DISTRIBUTION_RESULT: ${{ needs.distribution.result }}
          PUBLIC_DEPENDENCIES_RESULT: ${{ needs.public-dependencies.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          ATLAS_RESULT: ${{ needs.atlas.result }}
        run: |
          test "$REPRODUCE_RESULT" = "success"
          test "$QUICKSTART_RESULT" = "success"
          test "$DISTRIBUTION_RESULT" = "success"
          test "$PUBLIC_DEPENDENCIES_RESULT" = "success"
          test "$LINT_RESULT" = "success"
          test "$ATLAS_RESULT" = "success"
