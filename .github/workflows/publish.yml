name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (must match pyproject.toml)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check version and source CI
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          version = os.environ["RELEASE_VERSION"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("A stable release version is required")
          if version != project["version"]:
              raise SystemExit("Requested version does not match pyproject.toml")
          PY
          run_id=$(gh run list --workflow reproduce.yml --commit "$GITHUB_SHA" \
            --branch main --event push --status success --json databaseId \
            --jq '.[0].databaseId // empty')
          test -n "$run_id" || { echo "Source commit has no successful main CI run"; exit 1; }
          echo "Source commit: $GITHUB_SHA; successful CI run: $run_id"
      - name: Build and check distributions
        run: |
          python -m pip install 'build>=1.3,<2' 'twine>=6,<7'
          python -m pip install -c requirements.txt 'jsonschema>=4.25,<5'
          python -m build
          python -m twine check --strict dist/*
          python tests/validate_distribution.py --dist-dir dist
          sha256sum dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/homological-observability/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
